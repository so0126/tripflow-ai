
## 프로젝트 이름
spring.application.name=tripflow-ai-backend
spring.config.import=optional:classpath:application-local.properties

## 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

## 로깅
logging.pattern.console=%clr(%-5level){green} %clr([%thread]){faint} %clr(%logger.%M\\(\\)){cyan}: %msg%n
logging.level.org.springframework.ai.tool=DEBUG

# MyBatis 디버깅 로깅
logging.level.com.tripflow.ai.planner.hotel.dao=DEBUG
logging.level.org.mybatis.spring=DEBUG

## 정적 리소스에 대해 캐시 사용 안 함
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

## 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

## Naver Travel Place Import (스케줄러)
# enabled=true 일 때만 네이버 장소 import 기능 사용
app.travel-place.import.naver.enabled=false
app.travel-place.import.naver.target-count=1000

# 앱 시작 시 1회 실행
app.travel-place.import.naver.startup.enabled=false
app.travel-place.import.naver.startup.exit-on-complete=false

# 매주 일요일 새벽 3시 실행
app.travel-place.import.naver.schedule.enabled=false
app.travel-place.import.naver.cron=0 0 3 * * SUN

## Travel Place Embedding Backfill (스케줄러)
app.embedding.backfill.enabled=false
app.embedding.backfill.force=false

## Toilet Scheduler
app.toilet.scheduler.enabled=false

## MyBatis
mybatis.config-location=classpath:mybatis/mapper-config.xml
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml

## HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=8
## 항상 2개를 준비해두어 빠른 응답
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
## 5분 이상 사용 안 하면 자동 종료
spring.datasource.hikari.idle-timeout=300000
## 15분 이상 연결 유지 불가
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.auto-commit=true
## 60초 이상 점유하면 경고 발생
spring.datasource.hikari.leak-detection-threshold=60000

## VectorStore
spring.ai.vectorstore.pgvector.initialize-schema=false

## Thymeleaf 설정
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

## Google Custom Search API
google.search.endpoint=https://www.googleapis.com/customsearch/v1

## Google OAuth2
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.base-url}/login/oauth2/code/google

## OAuth2 리다이렉트 URI
app.oauth2.authorized-redirect-uri=${app.frontend.base-url}

## 프론트엔드 URI
app.frontend.uri=${app.frontend.base-url}/oauth/callback

# AWS S3 기본 설정
cloud.aws.s3.bucket=tripflow-ai-s3
cloud.aws.region.static=ap-northeast-2

# Spring AI 재시도 설정 (기본 10회 → 3회로 축소)
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s
spring.ai.retry.on-client-errors=false

# HTTP 클라이언트 타임아웃
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=1s